// Dependencias nativas do app.
dependencies {
  // WebViewAssetLoader: serve o jogo de dentro do APK numa origem https.
  implementation 'androidx.webkit:webkit:1.12.1'
}

android {
  compileSdkVersion 35
  buildToolsVersion "35.0.0"

  defaultConfig {
    minSdkVersion 24
    targetSdkVersion 35

    // A versao do app acompanha a do jogo (package.json da raiz).
    versionCode 700
    versionName "0.7.0"

    generatedDensities = []

    // As arquiteturas saem da propriedade `abis` (ver package.json e o
    // workflow): o template do NativeScript so olha para ela.
  }

  aaptOptions {
    additionalParameters "--no-version-vectors"
    // Os arquivos do jogo ja vem comprimidos (PNG, JSON enxuto): guardar sem
    // compressao deixa a WebView ler direto do APK.
    noCompress 'png', 'jpg', 'gif'
  }
}
